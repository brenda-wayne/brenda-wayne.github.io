<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brenda &amp; Wayne — Share Your Photos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lock" id="lock">
    <div class="lock-card">
      <p class="lock-title">Brenda &amp; Wayne</p>
      <p class="lock-sub">Enter the code from your invitation card to continue</p>
      <input type="text" id="lockInput" inputmode="text" autocapitalize="characters" autocomplete="off" class="lock-input" placeholder="Code">
      <button type="button" id="lockBtn" class="btn btn-primary">Continue</button>
      <p class="lock-error" id="lockError" aria-live="polite"></p>
    </div>
  </div>

  <main class="frame">
    <!-- Corner Floral SVGs -->
    <img src="floral-top.svg" class="floral floral-top" alt="" aria-hidden="true">
    <img src="floral-bottom.svg" class="floral floral-bottom" alt="" aria-hidden="true">

    <p class="names">
      Brenda
      <span class="and">and</span>
      Wayne
    </p>
    <p class="subtitle">SHARE YOUR PHOTOS FROM THE DAY</p>

    <div class="divider" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 18.5C11 18.5 3.5 13.2 3.5 8.3C3.5 5.7 5.4 4 7.5 4C9 4 10.3 4.8 11 6.2C11.7 4.8 13 4 14.5 4C16.6 4 18.5 5.7 18.5 8.3C18.5 13.2 11 18.5 11 18.5Z"
            stroke="#b8935e" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </div>

    <p class="lede">
      <span> Thank you for helping us capture our special day! </span>
      <span> Tap below to add your photos. </span>
    </p>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="pickBtn">Add Your Photos</button>
    </div>

    <!-- Mobile-compatible input without hard camera lock -->
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">

    <p class="status" id="status" aria-live="polite"></p>
    <p class="upload-count" id="uploadCount"></p>

   <!-- <footer class="note">With love and gratitude — Brenda &amp; Wayne</footer> -->
  </main>

  <script src="config.js"></script>
  <script src="gate.js"></script>
  <script src="upload.js"></script>
</body>
</html>
